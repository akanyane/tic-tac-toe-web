<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1035"/>
      <stop offset="1" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="x" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="o" x1="34" y1="34" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#rim)" stroke-opacity="0.55"/>

  <!-- faint board grid -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>

  <!-- marks -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-width="5.5">
    <path d="M13 13 L27 27 M27 13 L13 27" stroke="url(#x)"/>
    <circle cx="44" cy="44" r="8" stroke="url(#o)"/>
  </g>
</svg>
